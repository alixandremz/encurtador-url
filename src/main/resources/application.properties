spring.application.name=encurtador-url

# prefixo usado para montar a url curta devolvida pela API
encurtador.base-url=http://localhost:8080

# --- perfil padrão (dev): H2 em memória + cache em memória ---
# Roda sem instalar nada. Para o stack completo (Postgres + Redis + app)
# use o perfil "docker", veja docker-compose.yml e application-docker.properties.

spring.datasource.url=jdbc:h2:mem:encurtador;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# cache simples em memória, sem precisar de Redis
spring.cache.type=simple

# console do H2 desligado: /h2-console colidiria com a rota de redirecionamento /{slug}.
spring.h2.console.enabled=false
