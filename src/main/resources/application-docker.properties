# Perfil "docker": usado quando a app sobe junto do docker-compose.
# Postgres e Redis são resolvidos pelos nomes dos serviços da rede do compose.

spring.datasource.url=jdbc:postgresql://db:5432/encurtador
spring.datasource.username=encurtador
spring.datasource.password=encurtador
spring.jpa.hibernate.ddl-auto=update

# cache no Redis (o padrão dev usa cache em memória)
spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379
